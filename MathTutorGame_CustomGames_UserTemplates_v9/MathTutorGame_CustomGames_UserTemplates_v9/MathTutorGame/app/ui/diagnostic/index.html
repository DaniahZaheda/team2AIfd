<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لعبة التشخيص</title>
  <link rel="stylesheet" href="games.css" />

  <style>
    .diagHeroes{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:10px 0 0}
    .diagHero{width:170px;height:120px;border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.25)}
    .diagHero img{width:120px;height:auto;transform:translateY(10px);filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
    .diagHint{color:#ffffffcc;text-align:center;margin-top:10px;font-weight:700}
  </style>
</head>

<body>

  <!-- شاشة البداية -->
  <section id="start-screen" class="screen active">
    <div class="start-container">
      <div class="grade-badge">
        <div class="badge-icon">🇵🇸🎮</div>
        <div class="badge-info">
          <h3>تشخيص مهارات الرياضيات</h3>
          <p>صفوف 1–4 (الفصلين)</p>
        </div>
      </div>

      <h1 class="game-title">
        <span class="title-word" style="--i:0">لعبة</span>
        <span class="title-word highlight" style="--i:1">التشخيص</span>
        <span class="title-word" style="--i:2">الذكي</span>
      </h1>
      <div class="diagHeroes">
        <div class="diagHero"><img src="/ui/assets/characters/boy.png" alt="ولد" /></div>
        <div class="diagHero"><img src="/ui/assets/characters/girl.png" alt="فتاة" /></div>
      </div>
      <div class="diagHint"> أُسيد ولُمى… بدنا نلعب تشخيص سريع وبعدين نعمل خطة ممتعة 🚀</div>


      <div class="student-info-form">
        <div class="form-grid">
          <div class="form-group">
            <label>الصف المستهدف</label>
            <select id="targetGrade" class="form-input">
              <option value="1">الصف الأول</option>
              <option value="2">الصف الثاني</option>
              <option value="3">الصف الثالث</option>
              <option value="4">الصف الرابع</option>
            </select>
          </div>
        </div>

<div class="start-action">
          <button id="startBtn" class="start-button">ابدأ التشخيص</button>
        </div>

        <div id="startStatus" style="text-align:center;"></div>
      </div>
    </div>
  </section>

  <!-- شاشة الأسئلة -->
  <section id="game-screen" class="screen">
    <div class="start-container">
      <div class="question-area">
        <div class="question-content">
          <div id="progressText" style="color:white;text-align:center;margin-bottom:10px;font-size:18px;"></div>
          <div id="questionText" class="question-text"></div>
          <input id="answerInput" class="form-input" style="color: rgb(255, 255, 255);"  placeholder="اكتب إجابتك هنا" />
          <div class="start-action">
            <button id="submitBtn" class="start-button">إرسال</button>
          </div>
          <div id="gameStatus" style="text-align:center;"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- شاشة النتائج -->
  <section id="results-screen" class="screen">
    <div class="results-container">
      <div class="celebration-area">
        <div class="result-title">
          <h1 id="result-main-title">نتيجة التشخيص</h1>
          <p id="result-subtitle">مهارات الطالب الممتازة والمهارات التي تحتاج تقوية</p>
        </div>
      </div>

      <div class="level-card">
        <h2 class="result-section-title">مهارات ممتازة ✅</h2>
        <ul id="strongList" style="color:white;font-size:1.15rem;line-height:2;"></ul>

        <h2 class="result-section-title" style="margin-top:18px;">مهارات بحاجة لتقوية 🔁</h2>
        <ul id="missingList" style="color:white;font-size:1.15rem;line-height:2;"></ul>

        <div id="notAssessedBox" style="display:none;margin-top:18px;">
          <h2 class="result-section-title">مهارات لم تُقيَّم بعد 📝</h2>
          <ul id="notAssessedList" style="color:white;font-size:1.05rem;line-height:2;"></ul>
        </div>
        <div class="start-action">
          <button id="planBtn" class="start-button" style="margin-bottom:10px;" onclick="window.location.href='/ui/plan.html'">ابدأ الخطة العلاجية 🎯</button>
          <button id="restartBtn" class="start-button">إعادة تشخيص</button>
        </div>
      </div>
    </div>
  </section>

  <script src="animations.js"></script>
  <script src="game_api.js"></script>
</body>
</html>
